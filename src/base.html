<!doctype html>
<html lang="$lang">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>$title</title>
<meta name="description" content="$description">
<link rel="canonical" href="$url">
<meta property="og:type" content="$og_type">
<meta property="og:locale" content="pt_BR">
<meta property="og:site_name" content="$site_name">
<meta property="og:title" content="$title">
<meta property="og:description" content="$description">
<meta property="og:url" content="$url">
$og_image
<meta name="twitter:card" content="summary">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f6f5f1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121316" media="(prefers-color-scheme: dark)">
<link rel="icon" href="${root}assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="${root}assets/styles.css">
$head_extra
</head>
<body>
<a class="skip" href="#conteudo">Pular para o conteúdo</a>
<header class="site-header">
  <div class="wrap header-inner">
    <a class="brand" href="${root}">$site_name</a>
    <nav aria-label="Principal">
      <ul>
        <li><a href="${root}#projetos">Projetos</a></li>
        <li><a href="${root}#como-trabalho">Como trabalho</a></li>
        <li><a href="${root}#stack">Stack</a></li>
        <li><a href="${root}#contato">Contato</a></li>
      </ul>
    </nav>
  </div>
</header>
<main id="conteudo">
$main
</main>
<footer class="site-footer">
  <div class="wrap footer-inner">
    <p>© $year $site_name</p>
    <p>Site estático gerado com Python. Dados de exemplo são fictícios.</p>
  </div>
</footer>
</body>
</html>
